[project]
name = "shashwat-ai-os"
version = "0.1.0"
description = "Shashwat AI OS - LiveKit Voice Agent with FastMCP Server, Sarvam STT, Gemini 2.5 Flash LLM, and OpenAI TTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "livekit-agents>=0.8.0",
    "livekit-plugins-gemini>=0.1.0",
    "livekit-plugins-openai>=0.8.0",
    "livekit-plugins-sarvam>=0.1.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
shashwat = "server:main"
shashwat_voice = "agent_shashwat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
